[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mkdocs-blueprint"
version = "0.1.0"
description = "A blueprint / drafting-sheet theme for MkDocs, built on Material for MkDocs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sharif Ndlovu" }]
requires-python = ">=3.8"
dependencies = ["mkdocs-material>=9.5"]
keywords = ["mkdocs", "mkdocs-theme", "mkdocs-material", "theme", "documentation"]
classifiers = [
  "Framework :: MkDocs",
  "Programming Language :: Python :: 3",
  "Topic :: Documentation",
]

[project.urls]
Homepage = "https://github.com/sharifndlovu123/mkdocs-blueprint"
Demo = "https://knowledgemap.devbridge.co.za"

[project.entry-points."mkdocs.themes"]
blueprint = "mkdocs_blueprint"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["mkdocs_blueprint"]
namespaces = false

[tool.setuptools.package-data]
mkdocs_blueprint = ["*.yml", "*.html", "partials/**/*", "assets/**/*"]
